services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - chongkran_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - chongkran_redis_data:/data

volumes:
  chongkran_postgres_data:
  chongkran_redis_data:
